{% extends 'marketplace/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Вход</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
                </form>
                <p class="text-center mt-3 text-muted">Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
