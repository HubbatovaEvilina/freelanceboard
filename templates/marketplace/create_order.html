{% extends 'marketplace/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <h3 class="card-title mb-4">Создание нового заказа</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Опубликовать заказ</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
